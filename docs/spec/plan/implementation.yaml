  # --------------------------------------------------------
  # PHASE 6: POLISH — Edge cases, messages, docs
  # --------------------------------------------------------
  - id: phase-6
    name: "Edge Cases & Documentation"
    description: "Tratamento de edge cases, mensagens pt-BR e documentacao"
    subtasks:
      - id: "6.1"
        description: "Implementar tratamento de edge cases: ambiguidade, conflitos, erros de API, audio inaudivel"
