# ============================================================
# SUMMARY
# ============================================================
summary:
  totalPhases: 6
  totalSubtasks: 21
  serviceBreakdown:
    infra: 3
    backend: 18
    # database: 0 (removido — sem DB na v1)
    # frontend: 0 (sem UI — WhatsApp e a interface)
  dataStrategy: |
    v1 sem banco de dados. Sources of truth:
    - Google Calendar = eventos, reunioes, lembretes
    - Google Drive = arquivos uploadados
    - WhatsApp = historico de conversas
    - .env = OAuth refresh token (single user)
    - Memoria (Set<eventId>) = lembretes ja enviados
  epicMapping:
    "Epic A (Foundation + WhatsApp)": "phase-1 + phase-2"
    "Epic B (Google + Drive)": "phase-3 (3.1, 3.2)"
    "Epic C (Calendar + Meet)": "phase-3 (3.3, 3.4)"
    "Epic D (Audio + Reminders + Polish)": "phase-3 (3.5, 3.6) + phase-6"
    "Testing": "phase-4 + phase-5"
  criticalPath:
    - "1.1 → 1.2 → 2.1 → 2.2 (webhook funcional)"
    - "2.4 → 2.5 (intent + routing)"
    - "2.1 → 3.1 → 3.2, 3.3, 3.4 (Google services dependem de OAuth)"
    - "3.3 → 3.6 (reminders dependem de Calendar)"
