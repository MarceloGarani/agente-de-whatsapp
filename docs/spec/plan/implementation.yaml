# Implementation Plan: Assistente Pessoal Inteligente via WhatsApp
# Generated by: @architect (Aria) — Spec Pipeline Phase 6
# Updated: Removido database layer (v1 sem banco — sources of truth sao Google/WhatsApp)

storyId: "EPIC-1"
createdAt: "2026-02-16T15:00:00.000Z"
createdBy: "@architect"
status: pending
complexity: COMPLEX
estimatedEffort: "3-4 semanas (4 epics, 6 fases, 21 subtasks)"

# Architectural Decisions (resolving Open Questions)
architecturalDecisions:
  OQ-1:
    question: "Qual provedor de hosting?"
    decision: "Railway"
    rationale: "Deploy simples para Node.js, SSL automatico, free tier para dev."

  OQ-2:
    question: "Qual banco de dados?"
    decision: "Nenhum na v1"
    rationale: "Sources of truth: Google Calendar (eventos), Google Drive (arquivos), WhatsApp (conversas). Tokens OAuth em .env. Estado de lembretes em memoria (Set<eventId>). Sem persistencia local = zero config, zero migrations."

  OQ-3:
    question: "Onde armazenar tokens OAuth?"
    decision: "Refresh token em .env (single user v1)"
    rationale: "Apos primeira autorizacao, salvar GOOGLE_REFRESH_TOKEN no .env. googleapis auto-renova access_token via refresh_token. Simples e suficiente para single-user."

  OQ-5:
    question: "Intervalo de lembrete?"
    decision: "Default 30 minutos, hardcoded v1"
    rationale: "30min e padrao universal. Evita complexidade de configuracao na v1."

  OQ-6:
    question: "Gmail API redundante com Calendar sendUpdates?"
    decision: "Manter email.service.ts simplificado"
    rationale: "Calendar sendUpdates envia convites Google nativos. Email service para convites customizados a nao-Google users e cancelamentos."

