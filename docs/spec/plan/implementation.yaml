  # --------------------------------------------------------
  # PHASE 5: INTEGRATION — End-to-end flows
  # --------------------------------------------------------
  - id: phase-5
    name: "Integration Tests"
    description: "Testes de integracao para fluxos completos"
    subtasks:
      - id: "5.1"
        description: "Teste de integracao: webhook recebe mensagem → intent classification → resposta"
        service: backend
        files:
          - "tests/integration/webhook.test.ts"
        verification:
          type: command
          command: "npx jest tests/integration/webhook.test.ts"
        status: pending
        dependencies: ["4.1", "4.2"]

      - id: "5.2"
        description: "Teste de integracao: fluxo completo de reuniao — comando → evento + Meet + convites"
        service: backend
        files:
          - "tests/integration/meeting-flow.test.ts"
        verification:
          type: command
          command: "npx jest tests/integration/meeting-flow.test.ts"
        status: pending
