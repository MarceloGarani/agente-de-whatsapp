# ============================================================
# PHASES (6 fases para COMPLEX)
# ============================================================

phases:
  # --------------------------------------------------------
  # PHASE 1: SETUP — Scaffold, config, utils
  # Corresponde ao inicio do Epic A
  # --------------------------------------------------------
  - id: phase-1
    name: "Setup & Infrastructure"
    description: "Scaffold do projeto, configuracao e utilitarios"
    subtasks:
      - id: "1.1"
        description: "Criar scaffold do projeto Node.js/TypeScript com package.json, tsconfig.json e .gitignore"
        service: infra
        files:
          - "package.json"
          - "tsconfig.json"
          - ".gitignore"
        verification:
          type: command
          command: "npm install && npx tsc --noEmit"
        status: pending
        notes: |
          package.json deve incluir scripts: dev, build, start, test, typecheck.
          tsconfig: strict=true, target=ES2022, module=NodeNext, outDir=dist/.
          .gitignore: node_modules/, dist/, .env, uploads/

      - id: "1.2"
        description: "Criar .env.example com todas as variaveis de ambiente e src/config/env.ts para validacao"
        service: infra
        files:
          - ".env.example"
          - "src/config/env.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["1.1"]
        notes: |
          env.ts exporta objeto tipado com validacao de campos obrigatorios.
          Lancar erro claro se variavel critica estiver faltando.
          Ver spec.md secao 10 para lista completa de env vars.

      - id: "1.3"
        description: "Criar tipos TypeScript compartilhados: Intent, Entity, MessageType, enums"
        service: backend
        files:
          - "src/types/index.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["1.1"]
        notes: |
          Incluir: Intent enum (upload_arquivo, criar_evento, criar_reuniao, cancelar_evento, ajuda),
          IntentResult { intent, entities, confidence }, MessageType enum.

      - id: "1.4"
        description: "Criar utilitarios: logger com pino (structured logging) e error-handler centralizado"
        service: backend
        files:
          - "src/utils/logger.ts"
          - "src/utils/error-handler.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["1.1"]
        notes: |
          Logger: pino com redact de tokens/keys. Niveis: info, warn, error.
          Error handler: classe AppError com code, statusCode, userMessage (pt-BR).
          Funcao handleApiError() para tratar erros de APIs externas uniformemente.

  # --------------------------------------------------------
  # PHASE 2: CORE IMPLEMENTATION — WhatsApp + NLU
  # Corresponde ao core do Epic A
  # --------------------------------------------------------
  - id: phase-2
    name: "Core: WhatsApp + NLU"
    description: "Servidor Express, webhook WhatsApp, intent classification e message routing"
    subtasks:
      - id: "2.1"
        description: "Criar Express server com health check e middleware de logging"
        service: backend
        files:
          - "src/server.ts"
        verification:
          type: api
          url: "http://localhost:3000/health"
          expectedStatus: 200
        status: pending
        dependencies: ["1.2", "1.4"]
        notes: |
          express.json() middleware. Health check em GET /health.
          Iniciar reminder scheduler. Log de startup com pino.
          Tratar shutdown graceful (SIGTERM).

      - id: "2.2"
        description: "Implementar webhook handler: GET para verificacao Meta + POST para recebimento de mensagens"
        service: backend
        files:
          - "src/webhooks/whatsapp.handler.ts"
        verification:
          type: api
          url: "http://localhost:3000/webhook?hub.mode=subscribe&hub.verify_token=test&hub.challenge=challenge123"
          expectedStatus: 200
        status: pending
        dependencies: ["2.1"]
        notes: |
          GET /webhook: verificar hub.verify_token, retornar hub.challenge.
          POST /webhook: responder 200 IMEDIATAMENTE, processar async (NFR-1).
          Extrair mensagem de req.body.entry[0].changes[0].value.messages[0].

      - id: "2.3"
        description: "Implementar WhatsApp client: envio de mensagens de texto e download de media"
        service: backend
        files:
          - "src/services/whatsapp.client.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["1.2", "1.4"]
        notes: |
          sendText(to, body): POST graph.facebook.com/v21.0/{PHONE_ID}/messages.
          downloadMedia(mediaId): 2-step — GET media URL, GET binary (arraybuffer).
          sendProcessingMessage(to): envia "Processando..." imediatamente (NFR-1).
          Timeout 10s em todas as chamadas.

      - id: "2.4"
        description: "Implementar intent classifier via OpenAI GPT function calling com structured output"
        service: backend
        files:
          - "src/services/intent-classifier.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["1.2", "1.3"]
        notes: |
          gpt-4o-mini com function calling (strict: true).
          Schema extract_intent: { intent, entities: { titulo, data, hora, duracao, participantes[] }, confidence }.
          System prompt pt-BR. Threshold confianca: 0.7. Timeout 10s.

      - id: "2.5"
        description: "Implementar message router que direciona mensagens por tipo (text/audio/document) e por intent"
        service: backend
        files:
          - "src/services/message-router.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["2.3", "2.4"]
        notes: |
          Text → intent-classifier → intent router.
          Audio → audio-transcriber → texto → intent-classifier.
          Document → intent = upload_arquivo.
          Intent router: switch(intent) → servico correspondente.

  # --------------------------------------------------------
  # PHASE 3: SECONDARY IMPLEMENTATION — Google + Audio + Reminders
  # Corresponde aos Epics B, C, D
  # --------------------------------------------------------
  - id: phase-3
    name: "Google Integration + Audio + Reminders"
    description: "OAuth Google, Drive, Calendar, Meet, Email, Audio transcription e lembretes"
    subtasks:
      - id: "3.1"
        description: "Implementar Google OAuth 2.0: authorization URL, callback handler e token management"
        service: backend
        files:
          - "src/services/google-auth.ts"
        verification:
          type: api
          url: "http://localhost:3000/auth/google"
          expectedStatus: 302
        status: pending
        dependencies: ["2.1"]
        notes: |
          GET /auth/google → redirect para Google consent screen.
          GET /auth/google/callback → trocar code por tokens.
          Salvar GOOGLE_REFRESH_TOKEN — usuario copia para .env manualmente (v1 single-user).
          Scopes: drive.file, calendar, gmail.send.
          access_type:'offline', prompt:'consent'.

      - id: "3.2"
        description: "Implementar Drive service: upload de arquivos e organizacao automatica em pastas por tipo/data"
        service: backend
        files:
          - "src/services/drive.service.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["3.1"]
        notes: |
          uploadFile(buffer, filename, mimeType): criar pasta por tipo + subpasta {mes-ano}.
          Usar drive.files.create com media stream.
          Scope: drive.file. Retornar {fileId, webViewLink, folderPath}.

      - id: "3.3"
        description: "Implementar Calendar service: criar/cancelar eventos, listar proximos, gerar link Google Meet"
        service: backend
        files:
          - "src/services/calendar.service.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["3.1"]
        notes: |
          createEvent: events.insert com conferenceDataVersion:1 para Meet link.
          deleteEvent: events.delete com sendUpdates:'all'.
          listUpcoming: events.list com singleEvents:true.
          Timezone: 'America/Sao_Paulo'.

      - id: "3.4"
        description: "Implementar email service simplificado: convites customizados via Nodemailer OAuth2"
        service: backend
        files:
          - "src/services/email.service.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["3.1"]
        notes: |
          Calendar sendUpdates ja envia convites Google nativos (OQ-6).
          Email service para: (1) convites a nao-Google users, (2) cancelamentos customizados.
          Transport: Nodemailer OAuth2.

      - id: "3.5"
        description: "Implementar audio transcriber: conversao OGG/Opus para MP3 via ffmpeg e transcricao via Whisper"
        service: backend
        files:
          - "src/services/audio-transcriber.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["1.2", "1.4"]
        notes: |
          Pipeline: Buffer OGG/Opus → temp file → fluent-ffmpeg → MP3 → Whisper API.
          gpt-4o-mini-transcribe, language:'pt'. Timeout 15s. Limpar temp files.

      - id: "3.6"
        description: "Implementar reminder scheduler: consulta Calendar API para eventos proximos e envia lembretes via WhatsApp"
        service: backend
        files:
          - "src/services/reminder.scheduler.ts"
        verification:
          type: command
          command: "npx tsc --noEmit"
        status: pending
        dependencies: ["2.3", "3.3"]
        notes: |
          node-cron: a cada 5 minutos consultar Calendar API (listUpcoming) para eventos em <= 30min.
          Set<string> em memoria com eventIds ja lembrados (evita duplicatas).
          Enviar lembrete via whatsapp.client com nome, horario, link Meet.
          Se servidor reiniciar, Set limpa — pior caso: lembrete duplicado (aceitavel v1).

  # --------------------------------------------------------
  # PHASE 4: TESTING — Unit tests
  # --------------------------------------------------------
  - id: phase-4
    name: "Unit Tests"
    description: "Testes unitarios para servicos core"
    subtasks:
      - id: "4.1"
